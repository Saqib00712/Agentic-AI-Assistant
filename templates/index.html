<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Agentic AI Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 600px;
            max-width: 95%;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 700px;
        }
        .chat-header {
            background: #1a73e8;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f9fafb;
        }
        .chat-message {
            margin-bottom: 12px;
            padding: 12px 16px;
            border-radius: 16px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .chat-message.user {
            background: #1a73e8;
            color: white;
            margin-left: auto;
        }
        .chat-message.bot {
            background: #e8edf3;
            color: #1e293b;
        }
        .chat-message .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e8edf3;
            border-top: 3px solid #1a73e8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .chat-input-area {
            display: flex;
            padding: 16px;
            background: white;
            border-top: 1px solid #e2e8f0;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 30px;
            font-size: 16px;
            outline: none;
        }
        .chat-input-area input:focus {
            border-color: #1a73e8;
        }
        .chat-input-area button {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }
        .chat-input-area button:hover {
            background: #1557b0;
        }
        .chat-input-area button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        .quick-actions {
            display: flex;
            gap: 8px;
            padding: 8px 16px 16px 16px;
            flex-wrap: wrap;
            background: #f9fafb;
        }
        .quick-actions button {
            background: #e8edf3;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            color: #1e293b;
            transition: background 0.2s;
        }
        .quick-actions button:hover {
            background: #d1d9e6;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            padding: 8px;
            background: #f9fafb;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🤖 Agentic AI Chatbot</div>

    <div class="chat-messages" id="chatMessages">
        <div class="chat-message bot">Hello! How can I help you today?</div>
    </div>

    <div class="quick-actions">
        <button onclick="sendMessage('Search the web for latest AI news.')">🔍 Search Web</button>
        <button onclick="sendMessage('Summarize the uploaded document.')">📄 Summarize</button>
        <button onclick="sendMessage('Save this to memory.')">🧠 Save Memory</button>
        <button onclick="sendMessage('Use calculator tool for 25 * 4.')">🧮 Calculator</button>
    </div>

    <div class="chat-input-area">
        <input type="text" id="messageInput" placeholder="Ask anything..." />
        <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
    <div class="footer">BappyGPT can make mistakes. Check important info.</div>
</div>

<script>
    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    // ✅ CORRECT: Use the working /agent endpoint
    const API_URL = '/agent';

    // Press Enter to send
    messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            sendMessage();
        }
    });

    async function sendMessage(message) {
        // If message is not provided, get it from input
        if (!message) {
            message = messageInput.value.trim();
            if (!message) return;
            messageInput.value = '';
        }

        // Disable input and button
        sendBtn.disabled = true;
        messageInput.disabled = true;

        // Add user message
        addMessage('user', message);

        // Add placeholder for bot response with loader
        const botMessageElement = document.createElement('div');
        botMessageElement.className = 'chat-message bot';
        botMessageElement.innerHTML = `<span class="loader"></span> Thinking...`;
        chatMessages.appendChild(botMessageElement);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        try {
            // ✅ CORRECT: Use thread_id and model as required by your backend
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    message: message,
                    thread_id: 'default',
                    model: 'gpt-4'
                })
            });

            // Read stream response
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let botReply = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value);
                const lines = chunk.split('\n');
                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        try {
                            const jsonStr = line.replace('data: ', '');
                            if (jsonStr === '[DONE]') continue;
                            const data = JSON.parse(jsonStr);
                            if (data.token) {
                                botReply += data.token;
                                botMessageElement.textContent = botReply;
                                chatMessages.scrollTop = chatMessages.scrollHeight;
                            }
                            if (data.done) {
                                // Finalize
                            }
                        } catch (e) {
                            // Skip invalid JSON
                        }
                    }
                }
            }

            // If no reply was received, show a fallback
            if (!botReply) {
                botMessageElement.textContent = 'No response received. Please try again.';
            }

        } catch (error) {
            console.error('Error:', error);
            botMessageElement.textContent = 'Sorry, an error occurred. Please try again.';
        }

        // Re-enable input and button
        sendBtn.disabled = false;
        messageInput.disabled = false;
        messageInput.focus();
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function addMessage(type, text) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `chat-message ${type}`;
        messageDiv.textContent = text;
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
</script>

</body>
</html>
